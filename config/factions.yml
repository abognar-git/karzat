# Faction (képviselőcsoport) presentation config for ciklus 43 (elected April 2026).
#
# SOURCE OF THE LIST: reference/wikidata/members_ckl43.json (pulled by scripts/pull_wikidata.py,
# 2026-08-18): 199 current holders of P39 "member of the National Assembly of Hungary" whose
# statement started on/after 2026-04-01, grouped by the P4100 parliamentary-group qualifier —
# TISZA 141 · Fidesz 44 · KDNP 8 · Mi Hazánk 6. Use P4100, not P102 (party membership lags:
# it still says Jobbik for Mi Hazánk MPs). Community-maintained data: VERIFY against
# kepviselok.cgi / <kepvcsop-tagsagok> before publishing, and match `id` to the API's spelling.
# tests/test_wikidata.py asserts the seat counts below equal the snapshot's summary.
#
# Colours are this project's presentation colours, not the parties' brands (Fidesz orange is
# the one conventional pick); TISZA is teal so it sits far from orange, blue and green. sort_order: left→right seating in the chamber diagram (parlament.hu: government
# benches to the Speaker's right, opposition to the left — VERIFY which way the diagram faces).

seats: 199

factions:
  - id: TISZA
    name: Tisztelet és Szabadság Párt
    colour: "#1f8a70"
    sort_order: 10
    wikidata_group: Tisztelet és Szabadság Párt
    wikidata_group_qid: Q125418097
    wikidata_seats_2026_08_18: 141
  - id: Fidesz
    name: Fidesz – Magyar Polgári Szövetség
    colour: "#f36f21"
    sort_order: 60
    wikidata_group: Fidesz
    wikidata_group_qid: Q387006
    wikidata_seats_2026_08_18: 44
  - id: KDNP
    name: Kereszténydemokrata Néppárt
    colour: "#2c6db2"
    sort_order: 70
    wikidata_group: Kereszténydemokrata Néppárt
    wikidata_group_qid: Q277879
    wikidata_seats_2026_08_18: 8
  - id: "Mi Hazánk"
    name: Mi Hazánk Mozgalom
    colour: "#3b5e2b"
    sort_order: 80
    wikidata_group: Mi Hazánk Mozgalom
    wikidata_group_qid: Q55443054
    wikidata_seats_2026_08_18: 6
  - id: független
    name: Független képviselők
    colour: "#8a8a8a"
    sort_order: 90
    wikidata_seats_2026_08_18: 0

# Vote positions — the six recorded states, exactly as the API's roll call prints them
# (karzat/normalise.py POSITIONS). tartózkodott IS present and counts against a motion under
# every present-based rule; "Jelen, nem szav." is present too; the last two are absences.
positions:
  igen:                 { api: "Igen",                        label: "Igen",                          glyph: "filled" }
  nem:                  { api: "Nem",                         label: "Nem",                           glyph: "hollow" }
  tartozkodott:         { api: "Tart.",                       label: "Tartózkodott",                  glyph: "half" }
  jelen_nem_szavazott:  { api: "Jelen, nem szav.",            label: "Jelen, nem szavazott",          glyph: "ring" }
  nem_szavazott:        { api: "Nem szav.",                   label: "Nem szavazott",                 glyph: "faint" }
  bejelentett_hianyzo:  { api: "Előre bejelentett hiányzó",   label: "Előre bejelentett hiányzó",     glyph: "dot" }

# Majority rules — implemented in karzat/majority.py (Rule enum); this block is documentation
# for the front end. `needed` formulas: N = present MPs or all MPs (seats) as stated.
# The API names the rule itself in "Szavazási mód" (api: below, observed 2026-08-18); the legal
# citations in the module remain marked VERIFY until read against njt.hu.
majority_rules:
  egyszeru:            { label: "Egyszerű többség",             base: present, needed: "floor(N/2)+1", api: ["Listás", "Titkos"] }
  abszolut:            { label: "Abszolút többség",             base: seats,   needed: "floor(N/2)+1", api: ["Listás az összes képviselő felével"] }   # 100 of 199
  ketharmad_jelenlevo: { label: "Jelen lévők kétharmada",        base: present, needed: "ceil(2N/3)", api: ["Listás a jelenlevők 2/3-ával"] }     # sarkalatos; sürgős tárgyalás
  ketharmad_osszes:    { label: "Összes képviselő kétharmada",  base: seats,   needed: "ceil(2N/3)", api: ["Listás az összes képviselő 2/3-ával", "Titkos az összes képviselő 2/3-ával"] }     # 133 — Alaptörvény, AB tagok, tisztségviselők
  negyotod_jelenlevo:  { label: "Jelen lévők négyötöde",        base: present, needed: "ceil(4N/5)", api: ["Listás a jelenlevők 4/5-ével"] }     # Házszabálytól eltérés
  negyotod_osszes:     { label: "Összes képviselő négyötöde",   base: seats,   needed: "ceil(4N/5)", api: ["Listás az összes képviselő 4/5-ével"] }  # 160 — seen in 2014 lists; basis VERIFY
  relativ:             { label: "Relatív többség",              base: candidates, needed: "n/a" }         # KE 2. forduló
