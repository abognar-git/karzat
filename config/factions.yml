# Vote positions — the seven recorded states, exactly as the API's roll call prints them
# (karzat/normalise.py POSITIONS). tartózkodott IS present and counts against a motion under
# every present-based rule; "Jelen, nem szav." is present too; the last three are absences.
# "Ig.távol" (excused absence) never occurs in cycle 43's first 259 roll calls; it does in 288
# of cycle 42's, so a page for cycle 42 must draw it.
positions:
  igen:                 { api: "Igen",                        label: "Igen",                          glyph: "filled" }
  nem:                  { api: "Nem",                         label: "Nem",                           glyph: "hollow" }
  tartozkodott:         { api: "Tart.",                       label: "Tartózkodott",                  glyph: "half" }
  jelen_nem_szavazott:  { api: "Jelen, nem szav.",            label: "Jelen, nem szavazott",          glyph: "ring" }
  nem_szavazott:        { api: "Nem szav.",                   label: "Nem szavazott",                 glyph: "faint" }
  bejelentett_hianyzo:  { api: "Előre bejelentett hiányzó",   label: "Előre bejelentett hiányzó",     glyph: "dot" }
  igazoltan_tavol:      { api: "Ig.távol",                    label: "Igazoltan távol",               glyph: "dot-ring" }

# Majority rules — implemented in karzat/majority.py (Rule enum); this block is documentation
# for the front end. `needed` formulas: N = present MPs or all MPs (seats) as stated.
# The API names the rule itself in "Szavazási mód" (api: below, observed 2026-08-18); the legal
# citations in the module remain marked VERIFY until read against njt.hu.
majority_rules:
  egyszeru:            { label: "Egyszerű többség",             base: present, needed: "floor(N/2)+1", api: ["Listás", "Titkos"] }
  abszolut:            { label: "Abszolút többség",             base: seats,   needed: "floor(N/2)+1", api: ["Listás az összes képviselő felével"] }   # 100 of 199
  ketharmad_jelenlevo: { label: "Jelen lévők kétharmada",        base: present, needed: "ceil(2N/3)", api: ["Listás a jelenlevők 2/3-ával"] }     # sarkalatos; sürgős tárgyalás
  ketharmad_osszes:    { label: "Összes képviselő kétharmada",  base: seats,   needed: "ceil(2N/3)", api: ["Listás az összes képviselő 2/3-ával", "Titkos az összes képviselő 2/3-ával"] }     # 133 — Alaptörvény, AB tagok, tisztségviselők
  negyotod_jelenlevo:  { label: "Jelen lévők négyötöde",        base: present, needed: "ceil(4N/5)", api: ["Listás a jelenlevők 4/5-ével"] }     # Házszabálytól eltérés
  negyotod_osszes:     { label: "Összes képviselő négyötöde",   base: seats,   needed: "ceil(4N/5)", api: ["Listás az összes képviselő 4/5-ével"] }  # 160 — seen in 2014 lists; basis VERIFY
  relativ:             { label: "Relatív többség",              base: candidates, needed: "n/a" }         # KE 2. forduló
