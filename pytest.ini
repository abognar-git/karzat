[pytest]
# -rs prints why a test was skipped. Without it a skip is a dot, and this suite skips for reasons that
# matter: no Chrome means the accessibility gate did not run, no node means the chart properties did not,
# an unbuilt site means half the checks looked at nothing. A silent skip reads exactly like a pass, and
# the whole discipline here is that a green has to be earned rather than assumed.
addopts = -rs
testpaths = tests
